<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Google Style</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
            box-shadow: -1px 0 3px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-title {
            font-size: 16px;
            font-weight: 500;
            color: #202124;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            animation: messageSlideIn 0.3s ease;
        }
        
        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        
        .message.ai .message-bubble {
            background: #f0f4f8;
            color: #202124;
            border-radius: 18px;
        }
        
        .message.user .message-bubble {
            background: #1f71e8;
            color: white;
            border-radius: 18px;
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .message.ai .message-avatar {
            background: #f0f4f8;
            color: #1f71e8;
        }
        
        .message.user .message-avatar {
            background: #1f71e8;
            color: white;
        }
        
        .message.loading .message-bubble {
            background: #f0f4f8;
            color: #5f6368;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            background: #5f6368;
            border-radius: 50%;
            animation: typingAnimation 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typingAnimation {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }
        
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid #e5e5e5;
            background: white;
        }
        
        .input-container {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        
        textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 24px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            max-height: 100px;
            line-height: 1.5;
        }
        
        textarea:focus {
            border-color: #1f71e8;
            box-shadow: 0 0 0 2px rgba(31, 113, 232, 0.1);
        }
        
        textarea::placeholder {
            color: #80868b;
        }
        
        .send-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1f71e8;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        
        .send-button:hover:not(:disabled) {
            background: #1765cc;
            box-shadow: 0 2px 8px rgba(31, 113, 232, 0.3);
        }
        
        .send-button:active:not(:disabled) {
            transform: scale(0.95);
        }
        
        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #5f6368;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.7;
        }
        
        .empty-state-text {
            font-size: 16px;
            font-weight: 500;
        }
        
        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 4px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #c6c6c6;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header">
        <div class="header-title">💬 AI Chat Assistant</div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="empty-state">
            <div class="empty-state-icon">💭</div>
            <div class="empty-state-text">Bắt đầu cuộc trò chuyện</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-container">
            <textarea
                id="question"
                placeholder="Nhập tin nhắn... (Enter để gửi, Shift + Enter để xuống dòng)"
                rows="1"
            ></textarea>
            <button id="sendButton" class="send-button" onclick="askAI()">➤</button>
        </div>
    </div>
</div>

<script>
    // Nhập API Key hợp lệ của bạn vào đây
    const API_KEY = "AQ.Ab8RN6JpDuLvXRCv4JUbKLF1vDWHVAuqfiz3yC2txekWEVs_Jg"; 

    const chatMessages = document.getElementById("chatMessages");
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("sendButton");

    // Auto-resize textarea
    questionInput.addEventListener("input", function() {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 100) + "px";
    });

    questionInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            askAI();
        }
    });

    function clearEmptyState() {
        const emptyState = chatMessages.querySelector(".empty-state");
        if (emptyState) {
            emptyState.remove();
        }
    }

    function addMessage(text, isUser) {
        clearEmptyState();

        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${isUser ? "user" : "ai"}`;

        const avatarDiv = document.createElement("div");
        avatarDiv.className = "message-avatar";
        avatarDiv.textContent = isUser ? "👤" : "🤖";

        const bubbleDiv = document.createElement("div");
        bubbleDiv.className = "message-bubble";
        bubbleDiv.textContent = text;

        if (!isUser) {
            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(bubbleDiv);
        } else {
            messageDiv.appendChild(bubbleDiv);
            messageDiv.appendChild(avatarDiv);
        }

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addLoadingMessage() {
        clearEmptyState();

        const messageDiv = document.createElement("div");
        messageDiv.className = "message loading";
        messageDiv.id = "loadingMessage";

        const avatarDiv = document.createElement("div");
        avatarDiv.className = "message-avatar";
        avatarDiv.textContent = "🤖";

        const bubbleDiv = document.createElement("div");
        bubbleDiv.className = "message-bubble";
        bubbleDiv.innerHTML = `
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        `;

        messageDiv.appendChild(avatarDiv);
        messageDiv.appendChild(bubbleDiv);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeLoadingMessage() {
        const loading = document.getElementById("loadingMessage");
        if (loading) loading.remove();
    }

    async function askAI() {
        const question = questionInput.value.trim();

        if (!question) {
            return;
        }

        if (!API_KEY || API_KEY === "YOUR_API_KEY") {
            addMessage("⚠️ Bạn chưa cấu hình API key hợp lệ.", false);
            return;
        }

        // Add user message
        addMessage(question, true);
        questionInput.value = "";
        questionInput.style.height = "auto";
        sendButton.disabled = true;

        // Add loading message
        addLoadingMessage();

        try {
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${API_KEY}`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [{ text: question }]
                            }
                        ]
                    })
                }
            );

            const data = await response.json();

            removeLoadingMessage();

            if (!response.ok) {
                console.error(data);
                const errorMsg = data.error?.message || "Không xác định";
                addMessage("❌ API lỗi: " + errorMsg, false);
                return;
            }

            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            addMessage(text || "❌ Không nhận được câu trả lời từ AI.", false);

        } catch (error) {
            console.error(error);
            removeLoadingMessage();
            addMessage("❌ Không thể kết nối đến Gemini.\n\n" + error.message, false);
        } finally {
            sendButton.disabled = false;
            questionInput.focus();
        }
    }
</script>

</body>
</html>
